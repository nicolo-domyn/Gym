math_with_judge:
  resources_servers:
    math_with_judge:
      entrypoint: app.py
      judge_model_server:
        type: responses_api_models
        name: policy_model
      judge_responses_create_params: {
        input: []
      }
      should_use_judge: false
      # Answer format check: the response must use the format its system prompt asks
      # for, given by the first rule whose prompt_text is in the system prompt; a sample
      # matching no rule has no format check (format_ok is None). With
      # penalize_answer_format, a response with format_ok false gets
      # max(0, reward - format_penalty), so only correct answers are penalized.
      answer_format_rules:
        - prompt_text: "ANSWER: $ANSWER"
          answer_format: answer_line
        - prompt_text: '\boxed'
          answer_format: boxed
      penalize_answer_format: false
      format_penalty: 0.5
      # Grade only the last ANSWER: line (its content wrapped in \boxed{}) when the
      # system prompt asks for one and the response has it, instead of the whole response.
      grade_answer_line: true
      domain: math
      verified: false
      description: OpenMathReasoning math dataset with math-verify and LLM-as-a-judge
      value: Improve math capabilities including AIME 24 / 25
math_with_judge_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      resources_server:
        type: resources_servers
        name: math_with_judge
      model_server:
        type: responses_api_models
        name: policy_model
      datasets:
      - name: train
        type: train
        jsonl_fpath: resources_servers/math_with_judge/data/OpenMathReasoning_train.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: train.jsonl
        license: Creative Commons Attribution 4.0 International
      - name: validation
        type: validation
        jsonl_fpath: resources_servers/math_with_judge/data/OpenMathReasoning_aime24_validation.jsonl
        huggingface_identifier:
          repo_id: nvidia/Nemotron-RL-math-OpenMathReasoning
          artifact_fpath: validation.jsonl
        license: Apache 2.0
      - name: example
        type: example
        jsonl_fpath: resources_servers/math_with_judge/data/example.jsonl
